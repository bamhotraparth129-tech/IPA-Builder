name: Build ViperSnake IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ViperSnake.xcodeproj \
            -scheme ViperSnake \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            VALIDATE_PRODUCT=NO \
            build

      - name: Package ViperSnake.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ViperSnake.app Payload/
          zip -r ViperSnake.ipa Payload

      - name: Upload ViperSnake.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViperSnake-ipa
          path: ViperSnake.ipa
