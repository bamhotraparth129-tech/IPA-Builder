name: Build Voxel_Craft IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare AppIcon asset catalog
        run: |
          set -euo pipefail
          ICON_DIR="Sources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"

          if [ -f "Assets/AppIcon.png" ]; then
            cp "Assets/AppIcon.png" "$ICON_DIR/Icon-1024.png"
          else
            swift -e '
            import Foundation
            import CoreGraphics
            import CoreText

            let width = 1024
            let height = 1024
            let colorSpace = CGColorSpaceCreateDeviceRGB()
            let bitmapInfo = CGImageAlphaInfo.premultipliedLast.rawValue
            guard let ctx = CGContext(
              data: nil,
              width: width,
              height: height,
              bitsPerComponent: 8,
              bytesPerRow: width * 4,
              space: colorSpace,
              bitmapInfo: bitmapInfo
            ) else { exit(1) }

            let rect = CGRect(x: 0, y: 0, width: width, height: height)
            let bgColor = CGColor(red: 0.06, green: 0.24, blue: 0.19, alpha: 1.0)
            ctx.setFillColor(bgColor)
            ctx.fill(rect)

            let text = "₹" as CFString
            let font = CTFontCreateWithName("Helvetica Neue Bold" as CFString, 540, nil)
            let attributes: [CFString: Any] = [
              kCTFontAttributeName: font,
              kCTForegroundColorAttributeName: CGColor(red: 1.0, green: 1.0, blue: 1.0, alpha: 1.0)
            ]
            let attrString = CFAttributedStringCreate(nil, text, attributes as CFDictionary)!
            let line = CTLineCreateWithAttributedString(attrString)
            let bounds = CTLineGetBoundsWithOptions(line, [])
            let x = (CGFloat(width) - bounds.width) / 2.0 - bounds.origin.x
            let y = (CGFloat(height) - bounds.height) / 2.0 - bounds.origin.y

            ctx.textPosition = CGPoint(x: x, y: y)
            CTLineDraw(line, ctx)

            guard let cgImage = ctx.makeImage() else { exit(1) }
            let url = URL(fileURLWithPath: "Sources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png")
            guard let dest = CGImageDestinationCreateWithURL(url as CFURL, "public.png" as CFString, 1, nil) else { exit(1) }
            CGImageDestinationAddImage(dest, cgImage, nil)
            if !CGImageDestinationFinalize(dest) { exit(1) }
            '
          fi

          cat > "$ICON_DIR/Contents.json" <<'EOF'
          {
            "images": [
              {
                "filename": "Icon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

      - name: Generate Xcode project with XcodeGen
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Voxel_Craft.xcodeproj \
            -scheme Voxel_Craft \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Voxel_Craft.ipa
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -name "Voxel_Craft.app" -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Voxel_Craft.ipa Payload

      - name: Upload Voxel_Craft.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxel_Craft-IPA
          path: Voxel_Craft.ipa
          if-no-files-found: error
