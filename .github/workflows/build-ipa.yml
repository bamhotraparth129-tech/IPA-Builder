name: Build Rupaiya IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AppIcon asset
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images": [
              {
                "filename": "icon_1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF
          cat << 'EOF' > Sources/Assets.xcassets/Contents.json
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF
          python3 - << 'PYEOF'
          from AppKit import NSBitmapImageRep, NSGraphicsContext, NSColor, NSBezierPath, NSRect, NSFont, NSString, NSFontAttributeName, NSForegroundColorAttributeName

          size = 1024
          rep = NSBitmapImageRep.alloc().initWithBitmapDataPlanes_pixelsWide_pixelsHigh_bitsPerSample_samplesPerPixel_hasAlpha_isPlanar_colorSpaceName_bytesPerRow_bitsPerPixel_(
              None, size, size, 8, 4, True, False, "NSCalibratedRGBColorSpace", 0, 0
          )
          ctx = NSGraphicsContext.graphicsContextWithBitmapImageRep_(rep)
          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.setCurrentContext_(ctx)

          NSColor.colorWithCalibratedRed_green_blue_alpha_(0.06, 0.24, 0.19, 1.0).setFill()
          NSBezierPath.bezierPathWithRect_(NSRect((0, 0), (size, size))).fill()

          NSColor.colorWithCalibratedRed_green_blue_alpha_(0.11, 0.48, 0.34, 1.0).setFill()
          badge = NSBezierPath.bezierPathWithRoundedRect_xRadius_yRadius_(NSRect((112, 112), (800, 800)), 180, 180)
          badge.fill()

          text = NSString.stringWithString_("₹")
          font = NSFont.boldSystemFontOfSize_(440)
          attrs = {
              NSFontAttributeName: font,
              NSForegroundColorAttributeName: NSColor.whiteColor()
          }
          text_size = text.sizeWithAttributes_(attrs)
          x = (size - text_size.width) / 2.0
          y = (size - text_size.height) / 2.0 - 10
          text.drawAtPoint_withAttributes_((x, y), attrs)

          NSGraphicsContext.restoreGraphicsState()
          png_data = rep.representationUsingType_properties_(4, None)
          png_data.writeToFile_atomically_("Sources/Assets.xcassets/AppIcon.appiconset/icon_1024.png", True)
          PYEOF

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project Rupaiya.xcodeproj \
            -scheme Rupaiya \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            VALIDATE_PRODUCT=NO \
            build

      - name: Package Rupaiya.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Rupaiya.app Payload/
          zip -r Rupaiya.ipa Payload

      - name: Upload Rupaiya.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rupaiya-ipa
          path: Rupaiya.ipa
